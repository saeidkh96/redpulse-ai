apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpulse-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redpulse-worker
  template:
    metadata:
      labels:
        app: redpulse-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: redpulse-ai:3.8.0
          envFrom:
            - secretRef:
                name: redpulse-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
