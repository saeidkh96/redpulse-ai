name: Streaming v3.5 Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  streaming-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Compile v3.5 streaming modules
        run: |
          python -m compileall \
            backend/app/streaming \
            backend/app/streaming_scale_v35 \
            backend/tests/test_v35_streaming_scale.py \
            backend/tests/test_v35_streaming_reliability.py \
            backend/tests/test_v35_kafka_reliability.py \
            backend/tests/test_v35_streaming_health_lakehouse.py

      - name: Run v3.5 streaming tests
        run: |
          python -m pytest \
            backend/tests/test_v35_streaming_scale.py \
            backend/tests/test_v35_streaming_reliability.py \
            backend/tests/test_v35_kafka_reliability.py \
            backend/tests/test_v35_streaming_health_lakehouse.py \
            backend/tests/test_kafka_adapter_optional.py \
            backend/tests/test_realtime_streaming.py \
            backend/tests/test_streaming_events.py \
            -q
