name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt pytest ruff
      - run: python -m compileall backend/app backend/tests simulator
      - run: ruff check backend/app backend/tests simulator
      - run: python -m pytest backend/tests simulator/tests -q
