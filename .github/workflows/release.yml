name: Release Validation

on:
  push:
    tags:
      - "v*"

jobs:
  release-validation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: redpulse
          POSTGRES_PASSWORD: redpulse
          POSTGRES_DB: redpulse
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U redpulse -d redpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://redpulse:redpulse@localhost:5433/redpulse

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest alembic

      - name: Compile
        run: python -m compileall backend/app backend/tests orchestration analytics simulator

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run full test suite
        run: python -m pytest backend/tests simulator/tests -q

      - name: Validate Docker build
        run: docker build -t redpulse-ai:${{ github.ref_name }} -f backend/Dockerfile .
